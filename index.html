<!DOCTYPE html>
<head>
	<title>CCT360 Lab 2</title>
</head>

<body>

	// alert
	<button onclick="clickFunction()">Maybe click me?</button>
	<script>
		function clickFunction() {
			alert("I have been clicked!");
		}
	</script>

	// image switching
	<p>Click the button to change the image seen below.</p>
	<img src="images/guitar.png" id="toChange" width="480"></img>
	<br>
	<br>

	<button onclick="clickFunction()">Change Image</button>
	<script>
	function clickFunction() {
		document.getElementById("toChange").src = "images/girl_guitar.jpg";
	}
	</script>
	

</body>
